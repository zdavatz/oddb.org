<VirtualHost *:80>
  ServerName generika.cc
  # Same service under another name: the path is carried over, which
  # only works with the trailing slash on the target.
  Redirect permanent / https://generika.cc/
</VirtualHost>

<VirtualHost *:80>
  ServerName www.generika.cc
  # Same service under another name: the path is carried over, which
  # only works with the trailing slash on the target. Permanent, because this
  # host has no certificate and will never serve anything of its own, while a
  # 302 leaves Google crawling it as a site in its own right - which is what
  # kept the legacy http://www.generika.cc/ property reporting 5xx.
  Redirect permanent / https://generika.cc/
</VirtualHost>

<VirtualHost *:80>
  ServerName generika.oddb.org
  # Same service under another name: the path is carried over, which
  # only works with the trailing slash on the target. Permanent for the same
  # reason as www.generika.cc above.
  Redirect permanent / https://generika.cc/
</VirtualHost>

<VirtualHost *:80>
