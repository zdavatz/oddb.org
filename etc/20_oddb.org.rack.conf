# Must stay the FIRST *:80 vhost: Apache serves it for any Host header that
# matches no ServerName, which previously fell through to sl_errors.oddb.org
# below and exposed its directory listing.
<VirtualHost *:80>
  ServerName catchall.oddb.org
  # ACME http-01 challenges must pass through untouched: sdif.oddb.org renews
  # with certbot's apache authenticator, which validates over
  # /.well-known/acme-challenge/. (ch.oddb.org renews standalone and is
  # unaffected either way.)
  RedirectMatch ^/(?!\.well-known/).* https://ch.oddb.org/de/gcc
</VirtualHost>

# doc/sl_errors is the DocumentRoot of sl_errors.oddb.org: the monthly SL error
# reports under YYYY/MM that BAG reads, written by Updater#update_bsv and
# BsvXmlPlugin. It stays fully browsable, db/ included. What changed is only
# that it is no longer the fallback for unmatched Host headers - see the
# catch-all vhost above.
<Directory /var/www/oddb.org/doc/sl_errors>
  Options ExecCGI FollowSymlinks Indexes
  IndexOptions NameWidth=*
  AllowOverride None
  Order allow,deny
  Allow from all
</Directory>

<VirtualHost *:80>
  DocumentRoot /var/www/oddb.org/doc/sl_errors
  ServerName sl_errors.oddb.org
</VirtualHost>

<Directory /var/www/oddb.org/doc>
  Options ExecCGI
  AllowOverride None
  Order allow,deny
  Allow from all
  Deny from 194.209.25.108
  ErrorDocument 500 /resources/errors/appdown.html
  ErrorDocument 503 /resources/errors/appdown.html
</Directory>
<Directory /var/www/oddb.org/data/rss/>
  Order allow,deny
  Allow from all
</Directory>

#RewriteLock /var/lock/rewrite-lock 

<VirtualHost *:80>
  ServerName ch.oddb.org
  Redirect permanent / https://ch.oddb.org/
</VirtualHost>

<VirtualHost *:80>
  ServerName www.oddb.org
  # Lands on a page, so the path must not be carried over -
  # "Redirect /" would append it to a target with no trailing slash.
  RedirectMatch ^/(?!\.well-known/).* https://ch.oddb.org/de/gcc
</VirtualHost>

# Without this, "Host: oddb.org" matches no ServerName and falls through to the
# first *:80 vhost, which is sl_errors.oddb.org - so http://oddb.org/ served a
# directory listing of doc/sl_errors, including 4.3 GB of debug logs under
# /db/. There is no certificate for oddb.org either, so a plain :80 redirect
# is what it needs; https://oddb.org/ never worked in the first place.
<VirtualHost *:80>
  ServerName oddb.org
  # RedirectMatch, not Redirect: "Redirect /" appends whatever follows the
  # matched prefix, and the target has no trailing slash, so /db/08.log came
  # out as https://ch.oddb.org/de/gccdb/08.log. Everything here goes to the
  # home page regardless of path. /.well-known/ is left alone so an ACME
  # challenge is never redirected.
  RedirectMatch ^/(?!\.well-known/).* https://ch.oddb.org/de/gcc
</VirtualHost>

