<VirtualHost *:80>
  ServerName anthroposophika.ch
  # Landing page on another host, so nothing may be appended: Redirect would
  # glue the remaining path onto the target and send /de/generika/ to
  # /de/anthroposophy/home/de/generika/. RedirectMatch consumes the path
  # instead. The exemption keeps an ACME challenge from being redirected away.
  RedirectMatch ^/(?!\.well-known/).* https://ch.oddb.org/de/anthroposophy/home/
</VirtualHost>

